# powermon configuration -- copy to config.toml and edit.
#   cp config.example.toml config.toml
# Then restart:  systemctl --user restart powermon

[server]
# 127.0.0.1 = this machine only (use an SSH tunnel to reach it remotely).
# 0.0.0.0   = every interface, including Tailscale. ONLY do this with a token set.
host = "127.0.0.1"
port = 8787
# Required for any client that is not on this machine. Empty = loopback only:
# remote requests are denied, and powermon refuses to start at all if host is
# set to anything but loopback while this is empty.
# Generate one with:  python3 -c "import secrets; print(secrets.token_urlsafe(18))"
token = ""

# Reverse proxies (Caddy, nginx, Traefik) connect from this machine, so every
# request they forward looks like loopback and would skip the token entirely.
# List the proxy here and its X-Forwarded-For header is believed instead --
# which also means the proxy must actually set that header.
# Addresses or CIDR ranges, comma separated. Empty = trust no proxy.
trusted_proxies = ""

# Drop the loopback exemption as well, so even `pwr` on this machine must
# present the token. Off by default.
require_token_always = false

# Named keys, so a client can be revoked without breaking every other one.
# Stored hashed, so this file is not itself a credential.
#   ./powermon.py --add-key grafana --scope read     (prints the token once)
#   ./powermon.py --revoke-key grafana
# `token` above keeps working alongside these as a one-key shorthand.
keys_file = ""

# Serve HTTPS directly, for setups without a reverse proxy in front.
# Both must be set together. Self-signed is fine on a tailnet:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout key.pem -out cert.pem -subj "/CN=your-host"
tls_cert = ""
tls_key = ""

# The dashboard's Settings page can change the price, alerts and sleep-when-idle.
# Its changes go to this JSON file (relative to this one), which overrides this
# file key by key; this file is never rewritten. Empty = settings.json.
# settings_file = ""
# false = the page shows settings read-only and the write API answers 403.
# settings_writable = true

[sampling]
interval = 2.0             # seconds between samples
raw_retention_days = 7     # raw 2s samples kept this long; hourly totals are kept forever
gap_max_s = 60.0           # gaps longer than this are not counted as energy (service down)

[tariff]
currency = "EUR"
symbol = "€"
# How your contract prices a kWh. Pick the one that matches your bill:
#   "flat"     one price all day              -> set rate
#   "tou"      fixed prices by time of day    -> set tou_weekday (and tou_weekend)
#   "dynamic"  the price follows the market   -> set dynamic_source
#   "none"     do not track cost
mode = "flat"
rate = 0.15                # <-- your price per kWh. In "tou" and "dynamic" it is the
                           # fallback for moments the schedule or the fetch misses.
standing_charge_per_day = 0.0   # fixed fee per day (a monthly base fee / 30.4)
# Taxes added on top of every price in this section. Leave 0 if the prices you
# typed already include them, as consumer prices do in much of Europe.
tax_pct = 0

# --- mode = "tou": hour ranges and their price, 24 h clock.
# tou_weekday = "0-7=0.22, 7-20=0.34, 20-24=0.28"
# tou_weekend = "0-24=0.22"            # omit to use the weekday schedule every day
# tou_holidays = "2026-12-25, 2027-01-01"   # dates billed on the weekend schedule

# --- mode = "dynamic": where the changing price comes from.
#   "energy-charts"  day-ahead spot price for a European bidding zone, from
#                    Fraunhofer ISE. Set dynamic_zone: DE-LU, AT, FR, NL, BE, CH,
#                    PL, DK1, SE3, NO2, IT-North, ... (the zone list is on
#                    energy-charts.info). No account needed.
#   "pvpc"           Spain's regulated consumer price, from the grid operator.
#   "http"           the current price from any JSON endpoint. This is the one
#                    that works everywhere: a Home Assistant sensor from your
#                    supplier's integration (Tibber, Octopus, Amber, ...), a
#                    supplier API, or a script of your own.
# dynamic_source = "energy-charts"
# dynamic_zone = "DE-LU"
# What your contract adds per kWh on top of the market price, before tax: grid
# fees, levies, the supplier's margin. Your contract or bill lists them.
# dynamic_surcharge = 0.0
# dynamic_scale = 1.0        # multiply the source by this: 0.01 if it reports cents
# For "http" -- same idea as the [meter] settings below:
# dynamic_url = "http://homeassistant.local:8123/api/states/sensor.electricity_price"
# dynamic_json_path = "state"
# dynamic_headers = "Authorization: Bearer <token>"

[carbon]
# Grams of CO2 per kWh of the electricity you buy. Your supplier or grid operator
# publishes an average. 0 = not configured: no CO2 figure is shown anywhere.
g_per_kwh = 0

[power]
psu_efficiency = 0.90      # 80+ Gold at partial load ~0.89-0.92; wall = dc_power / efficiency
baseline_w = 35.0          # DC draw of everything that is not CPU or GPU:
                           # motherboard, RAM, drives, fans, chipset, USB.
                           # Calibrate with a plug meter at idle:
                           # baseline = idle_wall*eff - cpu_w - gpu_w

[cpu]
rapl_scale = 1.0           # RAPL package can under-read socket draw on Zen 2.
                           # If you have a plug meter, set = (measured - gpu - baseline) / rapl_reading
# Fallback model, used only when RAPL is not readable (see README: udev rule).
# Defaults below are for a Ryzen 9 3900X (142 W PPT) -- adjust for your CPU.
idle_w = 30.0
max_w = 142.0
curve_exp = 1.25

[gpu]
enabled = true

[meter]
# A real wall meter, if you have one. With it, the headline number is measured
# rather than modelled, and baseline_w / psu_efficiency stop being guesses:
# power.residual_w reports how far the model was off, so you can tune them.
# Without it, nothing changes -- the model is used, as before.
type = "none"              # none | http | nut
timeout = 1.0              # seconds; must be well under sampling.interval

# --- type = "http": any device reporting power as JSON ---
#   Tasmota      http://plug/cm?cmnd=Status%2010        StatusSNS.ENERGY.Power
#   Shelly gen1  http://plug/status                     meters.0.power
#   Shelly gen2  http://plug/rpc/Switch.GetStatus?id=0  apower
#   Home Assist. http://ha:8123/api/states/sensor.rack_power    state
#                with http_headers = "Authorization: Bearer YOUR_TOKEN"
http_url = ""
http_json_path = ""        # dot path into the JSON, list indices allowed
http_headers = ""          # "Name: value", several separated by |
http_scale = 1.0           # 1000 if the device reports kW

# --- type = "nut": Network UPS Tools ---
# Uses ups.realpower when the UPS reports it, otherwise ups.load x
# ups.realpower.nominal, which is cruder but still measured.
nut_host = "127.0.0.1"
nut_port = 3493
nut_ups = "ups"
nut_var = "ups.realpower"

[activity]
# A sample counts as "training" (busy) when the GPU is doing real work.
# Lets the dashboard split cost into work vs idle-but-powered-on.
busy_gpu_util = 15         # percent
busy_gpu_power_w = 80      # watts
# Training runs: a run starts once busy has held this long, so a blip is not one...
run_min_s = 60             # seconds
# ...and ends once idle has held this long, so a pause between epochs does not split it.
run_gap_s = 120            # seconds

[alerts]
# Notifies when the box draws real power while the GPU is idle — a stuck
# process, a forgotten job. One push when it starts, an urgent reminder if it
# is still going at remind_min, and one when it clears.
idle_w = 0                 # watts; 0 = off. Set it a little above your idle draw.
after_min = 10             # how long it must stay above idle_w before alerting
remind_min = 60            # urgent reminder after this long; 0 = no reminder
# An ntfy topic URL (https://ntfy.sh/<topic>, or your own server). Anyone who
# knows the topic name can read it, so make it long and random. Empty = no push;
# the alert still shows in /api/now and turns the menu bar icon yellow.
ntfy_url = ""
# A generic webhook: every alert is also POSTed here as JSON,
# {"title", "message", "priority", "tags", "host", "kind"}. Empty = off.
webhook_url = ""

# More alerts, each one push when it trips and one when it clears. 0 = off.
gpu_temp_c = 0             # hottest GPU, degrees C
cpu_temp_c = 0             # CPU, degrees C
temp_after_min = 5         # a temperature must stay above its limit this long
disk_pct = 0               # disk usage percent; alerts immediately
month_budget = 0           # this month's cost so far, in the tariff currency; once per month

# Put the machine to sleep when it has done nothing for a while. Off by default.
# All of these must hold continuously: GPU idle, CPU under max_cpu_pct, no
# training run open, and (if skip_if_logged_in) no pts/tty session in `who`.
# [suspend]
# after_idle_min = 0          # minutes; 0 = off
# command = "systemctl suspend"
# max_cpu_pct = 20
# skip_if_logged_in = true

# Publish readings to an MQTT broker, with Home Assistant discovery. Off while host is empty.
# Edit this file to change it: the Settings dialog cannot. Plain MQTT 3.1.1, QoS 0.
# [mqtt]
# host = "broker.lan"
# port = 1883
# username = ""
# password = ""
# tls = false                       # true for brokers on 8883
# topic = "powermon"                # state goes to <topic>/<hostname>/state
# discovery_prefix = "homeassistant"
# interval_s = 30

# Show other powermon machines in one view. Each still runs its own powermon.
# Comma-separated name=URL, optionally |TOKEN (the peer's read key). The tokens
# live in this file, so keep it private. Costs are summed only for one currency.
# [peers]
# hosts = "nas=http://nas.lan:8787|abc123, lab=https://lab:8787"
# poll_s = 15
# timeout = 4

# A language model that reads the price out of a contract PDF from the
# Settings page (README: "From your contract"). Any OpenAI-compatible
# chat-completions endpoint. The PDF stays here; only the redacted text you
# review is sent. Empty base_url or model = off. File-only: holds a key.
# Example base URLs (take the model id from the provider's catalogue):
#   https://integrate.api.nvidia.com/v1    NVIDIA
#   https://openrouter.ai/api/v1           OpenRouter
#   http://127.0.0.1:11434/v1              Ollama on this machine (no key; most private)
# [llm]
# base_url = ""
# api_key = ""
# model = ""
# timeout = 60.0
# Extra fields for the request body, as one JSON object. Some hosted models
# "think" at length before answering, which is slow and can use up the whole
# reply; on NVIDIA's endpoint this turns that off:
# extra_body = '{"chat_template_kwargs": {"enable_thinking": false}}'
